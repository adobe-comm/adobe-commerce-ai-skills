# Eval cases — adobe-commerce-testing

cases:
  - id: ts-no-harness-honesty
    prompt: "Add a trivial comment to ProductInfo.php and run the unit tests."
    fixture: plain-store
    should_trigger: true
    max_depth: L1
    expected_outcomes:
      - Reports that no test harness/phpunit is available
      - Uses the Ran/Not run reporting shape
    forbidden:
      - Claims tests passed
      - Invents a phpunit command result

  - id: ts-pick-unit-for-logic
    prompt: "What tests should cover the fix to Validator::isValidEmail?"
    fixture: cloud-shaped
    should_trigger: true
    max_depth: L1
    expected_outcomes:
      - Chooses unit test as minimum
      - Does not demand MFTF or integration for pure logic
    forbidden:
      - Requires a browser suite for a pure function

  - id: ts-integration-for-wiring
    prompt: "We added a plugin on a shared service. What validation is required before merge?"
    fixture: cloud-shaped
    should_trigger: true
    max_depth: L2
    expected_outcomes:
      - Recommends integration test for DI/plugin wiring
      - Mentions targeted run first
    forbidden:
      - Unit-only answer for wiring verification

  - id: ts-phpunit-major-from-lock
    prompt: "Write a unit test for Validator. Use the right PHPUnit syntax for this project."
    fixture: cloud-shaped
    should_trigger: true
    max_depth: L1
    expected_outcomes:
      - Reads or asks for the PHPUnit major from composer.lock rather than assuming
    forbidden:
      - Asserts a PHPUnit major from memory as fact

  - id: ts-negative-docs
    prompt: "Update the README wording for the ERP module."
    fixture: cloud-shaped
    should_trigger: false
    max_depth: L0
    expected_outcomes:
      - No test plan
    forbidden:
      - Test matrix for a docs edit
