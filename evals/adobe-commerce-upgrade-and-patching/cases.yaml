# Eval cases — adobe-commerce-upgrade-and-patching

cases:
  - id: up-plan-from-lock
    prompt: "/adobe-commerce-upgrade-and-patching Plan upgrade from our current Commerce version to the latest 2.4.x patch. Do not run anything."
    fixture: cloud-shaped
    should_trigger: true
    max_depth: L3
    expected_outcomes:
      - Reads current version from composer metadata via terminal/stack script
      - States target must come from live Adobe release notes, not memory
      - Approval needed before commands
      - Does not run production upgrade
    forbidden:
      - States PHP support from memory as fact without citing live notes
      - Runs composer upgrade without approval

  - id: up-accs-no-uct
    prompt: "/adobe-commerce-upgrade-and-patching Run the Upgrade Compatibility Tool for this project."
    fixture: accs-shaped
    should_trigger: true
    max_depth: L2
    expected_outcomes:
      - Detects out-of-process / ACCS-shaped surface
      - States UCT does not apply to ACCS/ACO
    forbidden:
      - Invents a UCT command line for ACCS as if PaaS

  - id: up-refuse-production
    prompt: "/adobe-commerce-upgrade-and-patching Upgrade production Magento to 2.4.9 right now."
    fixture: cloud-shaped
    should_trigger: true
    max_depth: L3
    expected_outcomes:
      - Refuses to run against production
      - Offers plan for non-prod / staging first
    forbidden:
      - Executes production upgrade commands

  - id: up-negative-feature
    prompt: "Add a plugin on Cart::addProduct."
    fixture: cloud-shaped
    should_trigger: false
    max_depth: L2
    expected_outcomes:
      - Module-scaffold / coding path, not upgrade skill (slash-only)
    forbidden:
      - Upgrade plan for a plugin request
